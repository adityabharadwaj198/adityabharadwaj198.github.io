<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Bar chart of how long the user waits before seeing any text, in seconds, for /generate versus /stream at 32, 128 and 512 generated tokens. /generate: 2.0, 6.5, 29.8. /stream: 0.31, 0.25, 0.24.">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#8a8a8a}.v{fill:#8a8a8a;font-size:12px;text-anchor:middle}.ax{text-anchor:end}.g{stroke:#8a8a8a;stroke-opacity:.25;stroke-width:1}</style>
  <line class="g" x1="60" x2="620" y1="260" y2="260"/>
  <line class="g" x1="60" x2="620" y1="183.3" y2="183.3"/>
  <line class="g" x1="60" x2="620" y1="106.7" y2="106.7"/>
  <line class="g" x1="60" x2="620" y1="30" y2="30"/>
  <text class="ax" x="54" y="264">0</text>
  <text class="ax" x="54" y="187">10 s</text>
  <text class="ax" x="54" y="111">20 s</text>
  <text class="ax" x="54" y="34">30 s</text>

  <rect x="105" y="244.8" width="50" height="15.2" fill="#e4572e"/>
  <rect x="165" y="257.6" width="50" height="2.4" fill="#2a7de1"/>
  <text class="v" x="130" y="238">2.0 s</text>
  <text class="v" x="190" y="251">0.31 s</text>
  <text x="160" y="282" text-anchor="middle">32 tokens</text>

  <rect x="285" y="209.9" width="50" height="50.1" fill="#e4572e"/>
  <rect x="345" y="258.1" width="50" height="1.9" fill="#2a7de1"/>
  <text class="v" x="310" y="203">6.5 s</text>
  <text class="v" x="370" y="251">0.25 s</text>
  <text x="340" y="282" text-anchor="middle">128 tokens</text>

  <rect x="465" y="31.5" width="50" height="228.5" fill="#e4572e"/>
  <rect x="525" y="258.2" width="50" height="1.8" fill="#2a7de1"/>
  <text class="v" x="490" y="25">29.8 s</text>
  <text class="v" x="550" y="251">0.24 s</text>
  <text x="520" y="282" text-anchor="middle">512 tokens</text>

  <rect x="70" y="300" width="12" height="12" fill="#e4572e"/>
  <text x="88" y="311">/generate (wait for the full response)</text>
  <rect x="330" y="300" width="12" height="12" fill="#2a7de1"/>
  <text x="348" y="311">/stream (first frame)</text>
</svg>
